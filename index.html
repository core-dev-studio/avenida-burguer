        .container { max-width: 1100px; margin: 0 auto; padding: 20px 20px 120px; }

        .cat-banner h2 { position: relative; z-index: 2; font-family: 'Oswald', sans-serif; font-size: 2rem; letter-spacing: 5px; text-transform: uppercase; }
        .cat-banner::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 4px; display: flex; flex-direction: column; transition: 0.3s; }
        .card-top { display: flex; align-items: center; margin-bottom: 12px; }
        .item-img { width: 75px; height: 75px; background-size: cover; background-position: center; border-radius: 4px; margin-right: 12px; border: 1px solid #333; flex-shrink: 0; }
        .item-info h3 { font-family: 'Oswald', sans-serif; font-size: 1rem; text-transform: uppercase; color: #fff; }
        .item-info p { font-size: 0.7rem; color: #aaa; line-height: 1.3; }
        
        .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #222; }
        .price { font-family: 'Oswald', sans-serif; color: var(--gold); font-weight: 700; }
        .qty-control { display: flex; align-items: center; gap: 8px; background: #222; border-radius: 4px; padding: 2px 8px; border: 1px solid var(--gold); }
        .qty-btn { background: none; border: none; color: var(--gold); font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .qty-num { font-family: 'Oswald', sans-serif; min-width: 15px; text-align: center; font-size: 0.8rem; color: #fff; }
        .btn-add { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 15px; font-family: 'Oswald', sans-serif; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
        
        .cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--gold); padding: 15px 40px; display: none; border-radius: 50px; z-index: 2000; cursor: pointer; }
        .cart-bar span { font-family: 'Oswald', sans-serif; font-weight: 700; color: #000; text-transform: uppercase; }

        @media (max-width: 600px) {

    </style>

    function render() {
        const root = document.getElementById('menu-target');
        const nav = document.getElementById('nav-target');
        menuData.forEach((s, i) => {
            const l = document.createElement('a'); l.href = `#c-${i}`; l.className = 'nav-link'; l.innerText = s.cat;
            nav.appendChild(l);
            const el = document.createElement('section'); el.id = `c-${i}`;
            el.innerHTML = `<div class="cat-banner" style="background-image: url('${s.img}')"><h2>${s.cat}</h2></div><div class="grid">` + 
                s.items.map(it => {
                    const pic = it.thumb ? it.thumb : s.img;
                    return `<div class="card"><div class="card-top"><div class="item-img" style="background-image: url('${pic}')"></div><div class="item-info"><h3>${it.n}</h3><p>${it.d}</p></div></div><div class="card-bottom"><div class="price">R$ ${it.p}</div><div class="qty-control"><button class="qty-btn" onclick="updateQty('${it.id}', -1)">-</button><span class="qty-num" id="qty-${it.id}">1</span><button class="qty-btn" onclick="updateQty('${it.id}', 1)">+</button></div><button id="btn-${it.id}" class="btn-add" onclick="addToCart('${it.n}', '${it.id}')">ADICIONAR</button></div></div>`
                }).join('') + `</div>`;
            root.appendChild(el);
        });
    }

    function updateQty(id, change) {
        const span = document.getElementById(`qty-${id}`);
        let current = parseInt(span.innerText);
        let next = current + change;
        if (next >= 1 && next <= 10) span.innerText = next;
    }

    function addToCart(n, id) {
        const qty = parseInt(document.getElementById(`qty-${id}`).innerText);
        const index = cart.findIndex(x => x.id === id);
        if (index > -1) { cart[index].qty = qty; } else { cart.push({ n, id, qty }); }
        document.getElementById('cart-bar').style.display = 'flex';
        const total = cart.reduce((acc, item) => acc + item.qty, 0);
        document.getElementById('cart-count').innerText = total;
        const btn = document.getElementById(`btn-${id}`);
        btn.innerText = "✓";
        setTimeout(() => btn.innerText = "ADICIONAR", 800);
    }

    function sendWhatsApp() {
        let m = "PEDIDO - AVENIDA BURGUER\n\n";
        cart.forEach(x => { m += `${x.qty}x ${x.n}\n`; });
        window.open(`https://wa.me/5574999822095?text=${encodeURIComponent(m + "\nAguardo confirmação.")}`);
    }
    render();
